pers, Past Papers & MCQs — Contact: 0340-8057780 The famous Tower of London was built as a fortress by William the Conqueror. Early in the Middle Ages the kings used it as a palace; later on it was turned into a prison, but only distinguished prisoners, including statesmen and princes, were held there. Today the Tower is a national museum, where, among other things, the jewelry of the glish kings and queens is on display"},"answer":"a"},{"n":4,"q":"It is obvious from the passage that the functions of the Tower of London _____.","options":{"a":"were all established by William the Conqueror","b":"have always been controlled by the kings","c":"have varied greatly over the centuries","d":"are all of a military nature","e":"have not changed at all since the Middle Ages"},"answer":"c"},{"n":5,"q":"We learn from the passage that the Tower _____.","options":{"a":"was not originally intended to be a fortress","b":"was never a prison for ordinary people","c":"is still a unique example of medieval architecture. r","d":"was never a residence of English kings","e":"functions today only as a jewelers museum"},"answer":"b"},{"n":6,"q":"William the Conqueror’s original purpose in building the Tower of London _____.","options":{"a":"was one of defense","b":"was to exhibit his valuable jewelry","c":"was strongly criticized later in the Middle Ages","d":"remains unknown even now","e":"is still being debated among historians. Never before in history have people been so aware of what is going on in the world. Television, newspapers and radio keep us continually informed and stimulate our interest. The sociologist’s interest in the world around him is intense, for society is his field of study. Indeed, he needs to know what is happening in society; he wants to know what makes the social world what it is, how it is organized, why it changes in the ways that it does. Such knowledge is valuable not only for those who make great decisions, but also for you, since this is the world in which you live and ake your way"},"answer":"a"},{"n":7,"q":"The passage emphasizes that whatever goes on in the world today _____.","options":{"a":"is quickly forgotten by the majority","b":"only concerns the sociologist","c":"first makes the headlines in the press","d":"is of great interest to everyone","e":"can easily be ignored by people in power"},"answer":"d"},{"n":8,"q":"It is pointed out in the passage that, among other things, sociologists are very much interested in _____.","options":{"a":"our reaction to their studies","b":"the effect of television on education","c":"the reasons for social change","d":"how people make a living in the world","e":"environmental problems"},"answer":"c"},{"n":9,"q":"One may conclude from the passage that the studies made by sociologists _____. E English Center: Notes, Guess Papers, Past Papers & MCQs — Contact: 0340-8057780","options":{"a":"are extremely useful both to decision makers and to ordinary people","b":"are of little general interest","c":"receive a lot of attention from the media","d":"are primarily intended for students of sociology","e":"do not adequately reflect real conditions in the world. very summer many people, girls and women as well as boys and , try to swim from England to France or from France to England. The distance at the nearest points is only about twenty miles, but because of the strong currents the distance that must be swum is usually twice as far. The first man to succeed in swimming across the Channel was Captain Webb, an Englishman. This was in August 1875. He landed in France 21 hours 45 minutes after entering the water at Dover. Since then there have been many successful swims and the time has been shortened. One French swimmer crossed in 11 hours and 5 minutes"},"answer":"a"},{"n":10,"q":"Swimming the Channel is not as easy as it might seem _____.","options":{"a":"as the distance between the two counties is far too much","b":"and it always takes more or less 20 hours","c":"and only two people have managed to do it so far. r","d":"so few people even try to swim it","e":"for there are very strong currents"},"answer":"e"},{"n":11,"q":"The first time anyone swam across the Channel _____.","options":{"a":"was in the last century","b":"was when England and France organized a swimming competition","c":"no one really believed him","d":"he was helped by favorable currents","e":"he reached Dover just before 10 in the evening"},"answer":"a"},{"n":12,"q":"The time Captain Webb needed to swim across the Channel_____.","options":{"a":"was unbelievably short","b":"has since been nearly reduced to half","c":"still remains a record","d":"was thought to be far too long","e":"hasn’t been equaled by any French swimmer. A new discovery of a dinosaur fossil in Antarctica has confirmed the idea that dinosaurs lived not only in the Northern Hemisphere but in the Southern Hemisphere as well. Up until this discovery, scientists had found dinosaur remains on every continent except Antarctica. This new discovery now confirms the idea that dinosaurs were distributed worldwide. If the dinosaur fossil is shown to be related to other dinosaurs of the same period in South America, it will also support the idea that South America and Antarctica were once linked together"},"answer":"b"},{"n":13,"q":"It is only recently that _____.","options":{"a":"important scientific studies about the Southern Hemisphere have been carried out","b":"scientists have been seriously interested in fossils","c":"a dinosaur fossil has been discovered in Antarctica","d":"some new facts about the Northern Hemisphere have come to light","e":"Antarctica has been discovered"},"answer":"c"},{"n":14,"q":"One can understand from the passage that _____.","options":{"a":"dinosaurs, at one time in the past, lived in both hemispheres","b":"dinosaurs were in fact, more commonly found in the Southern Hemisphere","c":"scientists had long since realized that dinosaurs had actually lived in Antarctica","d":"the dinosaur fossil, discovered in Antarctica, was significantly different from those found in other continents","e":"the discovery of the dinosaur fossil in Antarctica was actually of little importance to scientists. English Center: Notes, Guess Papers, Past Papers & MCQs — Contact: 0340-8057780"},"answer":"a"},{"n":15,"q":"It is hoped that the discovery of the dinosaur fossil in Antarctica_____.","options":{"a":"would contribute significantly to our knowledge of the Northern Hemisphere","b":"will throw further light on the existence of dinosaurs in the past","c":"would lead to further similar discoveries in the Southern Hemisphere","d":"could answer the question whether South America and Antarctica were originally connected","e":"will attract more scientists to this type of work A popular method of treating frozen fingers and toes in very cold, ven freezing weather is to slowly rewarm them or rub them with snow. The best treatment, however, is not slow rewarming but rapid rewarming. Putting the frozen fingers or toes in a warm bath or using a hot water bottle are both good ways to treat them. Hot drinks to warm the body from within are also helpful. One must be careful about burning the skin, however. The temperature of any heat applied should not be greater than 43 C"},"answer":"d"},{"n":16,"q":"The main concern of the passage is _____.","options":{"a":"why frozen fingers and toes should be slowly rewarmed","b":"how to keep adequately warm in the winter. r","c":"how to treat fingers and toes that have been frozen","d":"the dangers of freezing weather for the body","e":"why one should have plenty of hot drinks in winter"},"answer":"c"},{"n":17,"q":"It is pointed out in the passage that _____.","options":{"a":"the use of hot water bottles to rewarm the body is not advisable","b":"one should try to rewarm frozen fingers and toes fairly rapidly","c":"in rewarming the body the higher the temperature the better the result is","d":"people should be warned not to go out in freezingly cold weather","e":"one should take a bath as often as possible in winter"},"answer":"b"},{"n":18,"q":"The author warns that _____.","options":{"a":"the minimum temperature required is 43 C","b":"in rewarming the body, care must be taken not to burn the skin","c":"one should never rub frozen fingers and toes with snow","d":"hot drinks must not be taken in immediately","e":"recovery cannot be as rapid as one would expect. Bicycling in America has been growing at an amazing rate. Bicycles used to be sold to parents for their children. Now those same parents are buying them for themselves, as well as for their children. And grandparents are cycling, too. Moreover, people don’t simply cycle for fun and for the exercise. any young executives ride bikes to work as an alternative to adding to the pollution of cities, and to fighting traffic jams, while college and high school students find bikes an economical alternative to cars or buses"},"answer":"b"},{"n":19,"q":"In the passage it is emphasized that, in America _____.","options":{"a":"more and more people of all ages are now using bicycles","b":"few college students can afford to run a car","c":"no executive feels he can cycle to work","d":"most parents feel it is dangerous for children to cycle to school","e":"a great many traffic jams are being caused by cyclists"},"answer":"a"},{"n":20,"q":"Cycling is also a hobby that _____.","options":{"a":"attracts fewer and fewer people","b":"is getting increasingly more expensive","c":"only appeals to the young","d":"has a high-accident rate","e":"the whole family can enjoy"},"answer":"e"},{"n":21,"q":"From the passage we can infer that _____. E English Center: Notes, Guess Papers, Past Papers & MCQs — Contact: 0340-8057780","options":{"a":"different people have different reasons for preferring bicycles to a car","b":"most Americans can no longer afford to run a car","c":"young children should not be allowed to cycle on main roads","d":"a lot of parents are borrowing their children’s bicycles","e":"cycling is fun in the country but not in a city. On the day of my first piano recital, I became more and more nervous. To help me calm down, my piano teacher told me to place several cabbages in the room where I practiced. I was so eager to get over my nerves that I was willing to try anything. For the next few hours, I played to an audience of cabbages. When the time of the recital finally arrived, I was still terribly nervous. My hands felt like ice. When I finally walked across the stage, I looked out into the dark audience. I could not see anyone! All those people out there could just as easily have been cabbages. As I sat down to play, y hands relaxed. Before I knew it, I had played all my pieces without a mistake. For the first time, the cabbage heads applauded"},"answer":"a"},{"n":22,"q":"On the day of the recital the music teacher _____.","options":{"a":"advised the writer to put cabbages in the room where he practiced and play for them","b":"warned the writer not to look at the audience","c":"had no patience with the writer because he was nervous too. r","d":"felt nearly as nervous about the recital as the writer did","e":"couldn’t think of a way of helping the writer to stay calm"},"answer":"a"},{"n":23,"q":"The writer stopped feeling nervous _____.","options":{"a":"because he had practiced a great deal","b":"when the audience began to applaud","c":"before he walked onto the stage","d":"as soon as the concert was over","e":"when he found he couldn’t see the audience"},"answer":"e"},{"n":24,"q":"In the passage it is explained that _____.","options":{"a":"the writer was always nervous on the day of a concert","b":"the writer played to some cabbages because there was no real audience","c":"the writer finally began to relax just before he began his recital","d":"the room was so cold the writer’s hands felt like ice","e":"the writer always practiced in a room where there were cabbages ountaineering has this advantage over most other sports; enjoyment  to a constant desire for something new"},"answer":"d"},{"n":28,"q":"It is suggested in the passage that the modern child _____.","options":{"a":"wishes he had been born in the Victorian era","b":"suffers from boredom in spite of all the toys","c":"develops his abilities by playing with toys","d":"is well able to amuse himself","e":"is allowed to eat too much"},"answer":"b"},{"n":29,"q":"According to the passage _____.","options":{"a":"mechanical toys are essential to a child’s happiness","b":"a child should not be left to “make his own fun”","c":"home-made toys give more pleasure than ready-made ones","d":"there was a constant desire for something new","e":"simple toys slow down a child’s development. r"},"answer":"c"},{"n":30,"q":"The passage emphasizes _____.","options":{"a":"a child should have money to spend on toys","b":"the importance, in childhood, of a large choice of toys","c":"how lucky the modem child is","d":"that sweets are not good for the health","e":"the difference between a Victorian childhood and a present-day one. ost people were not impressed when in 1913, the Daily Mail newspaper offered 10.000 pounds to the first pilot to fly across the Atlantic in under 72 hours. The majority of scientists, even said it could not be done. Certainly the problems involved were many and far ranging. Obviously the design of the aero plane was of great importance, but so too were the skill and courage of the pilot and the navigator; weather conditions also had to be taken into consideration. A very few enthusiasts thought it might be possible ten years later. They were wrong. A pilot received the prize just six years later"},"answer":"e"},{"n":31,"q":"When the Daily Mail offered a prize in 1913, for flying across the Atlantic _____.","options":{"a":"there were few aero planes that could stay in the air for more than 72 hours","b":"many enthusiastic amateurs were eager to try","c":"the majority of scientists thought it could be done","d":"almost no one believed it he problems of youth","c":"educational programs on television are of little interest","d":"a lot of money is needed to make a good educational program","e":"young people are more interested in educational programs than their elders"},"answer":"c"},{"n":36,"q":"In the passage it is emphasized that a good educational program _____.","options":{"a":"has more influence on people if it is shown on television","b":"should in the first place be concerned with history and biology r","c":"should involve young people and encourage them to study the natural world","d":"can contribute a great deal to people’s awareness of environmental problems","e":"is one which is made creatively and contains a great deal of interesting material. Nowadays, in England, tea is quite the most popular, and also the cheapest, of all drinks. People drink their tea in different ways. Some like it with sugar, some without. Some drink it with milk, some with lemon; yet, one way or another just about everyone drinks tea. This, however, has not always been the case. During the last century, when tea was very expensive, it was kept locked up, and the lady of the house had the key. Tea drinking then was quite a ceremony, reserved for the evenings. At breakfast everyone drank beer!"},"answer":"e"},{"n":37,"q":"Compared with the past, in England today _____.","options":{"a":"more and more people prefer tea to beer","b":"tea is regarded as a luxury","c":"tea is very cheap and commonly available","d":"sugar is becoming less and less popular","e":"people don’t care about the quality of tea"},"answer":"c"},{"n":38,"q":"It is obvious from the passage that _____.","options":{"a":"English people have always regarded tea as better than beer","b":"over the years the popularity of tea in England has increased tremendously","c":"drinking tea with lemon is only a recent habit in England","d":"like tea, beer also is an extremely popular drink","e":"English people are no longer fond of ceremonies"},"answer":"b"},{"n":39, const $=id=>document.getElementById(id);
let activeChapter=-1, batch=0, deck=[], current=[], checked=false, answers={};
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filteredChapters(){const term=$('chapterSearch').value.trim().toLocaleLowerCase();return DATA.map((c,i)=>({...c,_i:i})).filter(c=>c.title.toLocaleLowerCase().includes(term))}
function chapterButton(ch){const b=document.createElement('button');b.className='chapter'+(ch._i===activeChapter?' active':'');b.type='button';b.innerHTML='<span></span><span class="arrow" aria-hidden="true">›</span>';b.firstElementChild.textContent=ch.title;b.addEventListener('click',()=>selectChapter(ch._i));return b}
function renderChapterLists(){const list=filteredChapters();for(const id of ['chapterGrid','contentsList']){const el=$(id);el.replaceChildren();list.forEach(ch=>el.appendChild(chapterButton(ch)));if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No chapter matches that name.';el.appendChild(e)}}}
function selectChapter(i){activeChapter=i;batch=0;deck=shuffle(DATA[i].questions);renderChapterLists();$('startState').classList.add('hidden');$('practice').classList.remove('hidden');$('chapterTitle').textContent=DATA[i].title;loadBatch()}
function loadBatch(){checked=false;answers={};const start=batch*5;current=deck.slice(start,start+5);if(current.length===0){deck=shuffle(DATA[activeChapter].questions);batch=0;current=deck.slice(0,5);$('notice').textContent='A new practice round is ready.'}else $('notice').textContent='';$('score').textContent='';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=false;$('nextBtn').classList.add('hidden');$('retryBtn').classList.add('hidden');renderQuestions()}
function renderQuestions(){const root=$('questions');root.replaceChildren();if(!current.length){const e=document.createElement('div');e.className='empty';e.textContent='Questions for this chapter are not available yet.';root.appendChild(e);$('checkBtn').disabled=true;return}current.forEach((q,idx)=>{const card=document.createElement('article');card.className='qcard';const title=document.createElement('div');title.className='qtext';title.textContent=(idx+1)+'. '+q.q;card.appendChild(title);const opts=document.createElement('div');opts.className='options';Object.keys(q.options||{}).filter(key=>/^[a-e]$/.test(key)).sort().forEach(key=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q-'+idx;input.value=key;input.disabled=checked;input.checked=answers[idx]===key;input.addEventListener('change',()=>{answers[idx]=key;opts.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected')});const span=document.createElement('span');span.textContent=key.toUpperCase()+'. '+q.options[key];label.append(input,span);if(input.checked)label.classList.add('selected');opts.appendChild(label)});card.appendChild(opts);const feedback=document.createElement('div');feedback.className='feedback';feedback.id='feedback-'+idx;card.appendChild(feedback);root.appendChild(card)})}
function explanation(q){const t=(q.q+' '+Object.values(q.options||{}).join(' ')).toLowerCase();const correct=q.options?.[q.answer]||'';if(/not a polysaccharide|sucrose/.test(t)&&/polysaccharide/.test(t))return 'Sucrose is a disaccharide, while starch, cellulose and glycogen are polysaccharides.';if(/long chain of amino acids|polypeptide/.test(t))return 'A polypeptide is a chain of amino acids linked by peptide bonds.';if(/secondary structure of proteins|hydrogen bonds/.test(t))return 'Hydrogen bonds help stabilize protein alpha-helices and beta-sheets.';if(/primary structure of a protein|sequence of amino acids/.test(t))return 'A protein’s primary structure is its specific amino-acid sequence.';if(/monosaccharide/.test(t)&&/glucose/.test(t))return 'Glucose is a single sugar unit, so it is a monosaccharide.';if(/si unit of force/.test(t))return 'The SI unit of force is the newton (N).';if(/si unit of electric current/.test(t))return 'Electric current is measured in amperes (A).';if(/si unit of energy/.test(t))return 'Energy is measured in joules (J) in the SI system.';if(/avogadro/.test(t))return 'Avogadro’s constant is approximately 6.022 × 10²³ entities per mole.';if(/molar mass of h₂o|molar mass of h2o/.test(t))return 'Water (H₂O) has a molar mass of about 18 g/mol: 2(1) + 16.';if(/present simple/.test(t)&&/reads a book|go to the gym|visit our grandparents/.test(t))return 'The present simple commonly describes habits, routines and general facts.';if(/past simple/.test(t)&&/ate breakfast|bought a car|went shopping/.test(t))return 'The past simple describes a completed past action.';if(/future simple/.test(t)&&/will/.test(correct.toLowerCase()))return 'The future simple is commonly formed with “will” + the base verb.';return 'Review this idea in the selected chapter and compare it with the correct option.'}
function checkAnswers(){if(checked)return;checked=true;let correct=0,scored=0,unscored=0;current.forEach((q,i)=>{const fb=$('feedback-'+i);const key=q.answer;const chosen=answers[i];const labels=$('questions').children[i].querySelectorAll('.option');labels.forEach(label=>{const input=label.querySelector('input');input.disabled=true;const opt=input.value;if(key&&opt===key)label.classList.add('correct');if(key&&chosen===opt&&chosen!==key)label.classList.add('incorrect')});if(key&&q.options&&q.options[key]){scored++;const isRight=chosen===key;if(isRight)correct++;fb.className='feedback show'+(isRight?'':' wrong');fb.textContent=(isRight?'Correct. ':'Correct answer: ')+key.toUpperCase()+'. '+q.options[key]+' — '+explanation(q)}else{unscored++;fb.className='feedback show';fb.textContent='The printed answer key could not be confirmed for this question, so it is not scored.'}});$('score').textContent='Correct answers: '+correct+(unscored?' • Unscored: '+unscored:'');$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('retryBtn').classList.remove('hidden');$('notice').textContent='Answers and explanations are now shown.'}
$('chapterSearch').addEventListener('input',renderChapterLists);$('checkBtn').addEventListener('click',checkAnswers);$('nextBtn').addEventListener('click',()=>{batch++;if(batch*5>=deck.length){deck=shuffle(DATA[activeChapter].questions);batch=0;$('notice').textContent='A new practice round is ready.'}loadBatch()});$('retryBtn').addEventListener('click',()=>{const prev=current.slice();current=prev;checked=false;answers={};$('score').textContent='';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=false;$('nextBtn').classList.add('hidden');$('retryBtn').classList.add('hidden');$('notice').textContent='';renderQuestions()});renderChapterLists();
