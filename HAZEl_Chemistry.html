const $=id=>document.getElementById(id);
let activeChapter=-1, batch=0, deck=[], current=[], checked=false, answers={};
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filteredChapters(){const term=$('chapterSearch').value.trim().toLocaleLowerCase();return DATA.map((c,i)=>({...c,_i:i})).filter(c=>c.title.toLocaleLowerCase().includes(term))}
function chapterButton(ch){const b=document.createElement('button');b.className='chapter'+(ch._i===activeChapter?' active':'');b.type='button';b.innerHTML='<span></span><span class="arrow" aria-hidden="true">›</span>';b.firstElementChild.textContent=ch.title;b.addEventListener('click',()=>selectChapter(ch._i));return b}
function renderChapterLists(){const list=filteredChapters();for(const id of ['chapterGrid','contentsList']){const el=$(id);el.replaceChildren();list.forEach(ch=>el.appendChild(chapterButton(ch)));if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No chapter matches that name.';el.appendChild(e)}}}
function selectChapter(i){activeChapter=i;batch=0;deck=shuffle(DATA[i].questions);renderChapterLists();$('startState').classList.add('hidden');$('practice').classList.remove('hidden');$('chapterTitle').textContent=DATA[i].title;loadBatch()}
function loadBatch(){checked=false;answers={};const start=batch*5;current=deck.slice(start,start+5);if(current.length===0){deck=shuffle(DATA[activeChapter].questions);batch=0;current=deck.slice(0,5);$('notice').textContent='A new practice round is ready.'}else $('notice').textContent='';$('score').textContent='';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=false;$('nextBtn').classList.add('hidden');$('retryBtn').classList.add('hidden');renderQuestions()}
function renderQuestions(){const root=$('questions');root.replaceChildren();if(!current.length){const e=document.createElement('div');e.className='empty';e.textContent='Questions for this chapter are not available yet.';root.appendChild(e);$('checkBtn').disabled=true;return}current.forEach((q,idx)=>{const card=document.createElement('article');card.className='qcard';const title=document.createElement('div');title.className='qtext';title.textContent=(idx+1)+'. '+q.q;card.appendChild(title);const opts=document.createElement('div');opts.className='options';Object.keys(q.options||{}).filter(key=>/^[a-e]$/.test(key)).sort().forEach(key=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q-'+idx;input.value=key;input.disabled=checked;input.checked=answers[idx]===key;input.addEventListener('change',()=>{answers[idx]=key;opts.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected')});const span=document.createElement('span');span.textContent=key.toUpperCase()+'. '+q.options[key];label.append(input,span);if(input.checked)label.classList.add('selected');opts.appendChild(label)});card.appendChild(opts);const feedback=document.createElement('div');feedback.className='feedback';feedback.id='feedback-'+idx;card.appendChild(feedback);root.appendChild(card)})}
function explanation(q){const t=(q.q+' '+Object.values(q.options||{}).join(' ')).toLowerCase();const correct=q.options?.[q.answer]||'';if(/not a polysaccharide|sucrose/.test(t)&&/polysaccharide/.test(t))return 'Sucrose is a disaccharide, while starch, cellulose and glycogen are polysaccharides.';if(/long chain of amino acids|polypeptide/.test(t))return 'A polypeptide is a chain of amino acids linked by peptide bonds.';if(/secondary structure of proteins|hydrogen bonds/.test(t))return 'Hydrogen bonds help stabilize protein alpha-helices and beta-sheets.';if(/primary structure of a protein|sequence of amino acids/.test(t))return 'A protein’s primary structure is its specific amino-acid sequence.';if(/monosaccharide/.test(t)&&/glucose/.test(t))return 'Glucose is a single sugar unit, so it is a monosaccharide.';if(/si unit of force/.test(t))return 'The SI unit of force is the newton (N).';if(/si unit of electric current/.test(t))return 'Electric current is measured in amperes (A).';if(/si unit of energy/.test(t))return 'Energy is measured in joules (J) in the SI system.';if(/avogadro/.test(t))return 'Avogadro’s constant is approximately 6.022 × 10²³ entities per mole.';if(/molar mass of h₂o|molar mass of h2o/.test(t))return 'Water (H₂O) has a molar mass of about 18 g/mol: 2(1) + 16.';if(/present simple/.test(t)&&/reads a book|go to the gym|visit our grandparents/.test(t))return 'The present simple commonly describes habits, routines and general facts.';if(/past simple/.test(t)&&/ate breakfast|bought a car|went shopping/.test(t))return 'The past simple describes a completed past action.';if(/future simple/.test(t)&&/will/.test(correct.toLowerCase()))return 'The future simple is commonly formed with “will” + the base verb.';return 'Review this idea in the selected chapter and compare it with the correct option.'}
function checkAnswers(){if(checked)return;checked=true;let correct=0,scored=0,unscored=0;current.forEach((q,i)=>{const fb=$('feedback-'+i);const key=q.answer;const chosen=answers[i];const labels=$('questions').children[i].querySelectorAll('.option');labels.forEach(label=>{const input=label.querySelector('input');input.disabled=true;const opt=input.value;if(key&&opt===key)label.classList.add('correct');if(key&&chosen===opt&&chosen!==key)label.classList.add('incorrect')});if(key&&q.options&&q.options[key]){scored++;const isRight=chosen===key;if(isRight)correct++;fb.className='feedback show'+(isRight?'':' wrong');fb.textContent=(isRight?'Correct. ':'Correct answer: ')+key.toUpperCase()+'. '+q.options[key]+' — '+explanation(q)}else{unscored++;fb.className='feedback show';fb.textContent='The printed answer key could not be confirmed for this question, so it is not scored.'}});$('score').textContent='Correct answers: '+correct+(unscored?' • Unscored: '+unscored:'');$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('retryBtn').classList.remove('hidden');$('notice').textContent='Answers and explanations are now shown.'}
