ectively bred"},"answer":"b"},{"n":15,"q":"Which biotechnological method is used to diagnose genetic disorders?","options":{"a":"DNA fingerprinting","b":"Gel electrophoresis","c":"DNA sequencing","d":"All of the above"},"answer":"d"},{"n":16,"q":"Which of the following is not a step in the PCR process?","options":{"a":"Denaturation","b":"Annealing","c":"Replication","d":"Extension"},"answer":"c"},{"n":17,"q":"What is the main purpose of gel electrophoresis in biotechnology?","options":{"a":"To sequence DNA","b":"To separate DNA fragments by size","c":"To amplify DNA","d":"To clone genes"},"answer":"b"},{"n":18,"q":"What is the significance of the Human Genome Project?","options":{"a":"It identified all human proteins","b":"It mapped the entire human DNA sequence","c":"It cloned the first human","d":"It discovered CRISPR technology"},"answer":"b"},{"n":19,"q":"Which of the following is a biotechnological application in agriculture?","options":{"a":"Developing drought-resistant crops","b":"Cloning animals","c":"Producing synthetic vaccines","d":"Sequencing bacterial genomes"},"answer":"a"},{"n":20,"q":"What is a vector in genetic engineering?","options":{"a":"An organism used to transfer genes","b":"A tool used to amplify DNA","c":"A molecule that binds to DNA","d":"A laboratory instrument"},"answer":"a"},{"n":21,"q":"Which biotechnological technique involves inserting a normal gene into a person's En genome to treat a genetic disorder?","options":{"a":"Cloning","b":"Gene therapy","c":"DNA fingerprinting","d":"Southern blotting"},"answer":"b"},{"n":22,"q":"What is the purpose of a DNA probe in biotechnology? E","options":{"a":"To replicate DNA","b":"To cut DNA","c":"To bind to specific DNA sequences","d":"To transcribe DNA"},"answer":"c"},{"n":23,"q":"Which of the following is a key ethical concern in biotechnology?","options":{"a":"The cost of biotechnological products","b":"The speed of technological advancements","c":"The potential for genetic discrimination","d":" ncing"},"answer":"c"},{"n":33,"q":"What is the purpose of a DNA microarray?","options":{"a":"To replicate DNA","b":"To analyze gene expression","c":"To cut DNA at specific sequences","d":"To separate DNA fragments by size"},"answer":"b"},{"n":34,"q":"Which type of biotechnology involves using living cells to produce pharmaceuticals?","options":{"a":"Industrial biotechnology","b":"Agricultural biotechnology","c":"Medical biotechnology","d":"Environmental biotechnology"},"answer":"c"},{"n":35,"q":"What is somatic cell nuclear transfer (SCNT)?","options":{"a":"A method to sequence DNA","b":"A technique used to create cloned animals E","c":"A process to introduce foreign DNA into a cell","d":"A method to analyze protein structure"},"answer":"b"},{"n":36,"q":"What is a major challenge in the field of gene therapy?","options":{"a":"Low cost of treatment","b":"Efficient and targeted delivery of genes","c":"High success rate","d":"Lack of interest from researchers"},"answer":"b"},{"n":37,"q":"Which of the following is a method used to identify individuals based on their unique DNA profiles?","options":{"a":"Gene therapy","b":"DNA fingerprinting","c":"Cloning","d":"Transgenesis"},"answer":"b"}]},{"title":"Biology and Human Welfare","questions":[{"n":1,"q":"Which of the following diseases is caused by bacteria?","options":{"a":"Malaria","b":"Tuberculosis","c":"HIV/AIDS","d":"Influenza"},"answer":"b"},{"n":2,"q":"Which of the following vectors is responsible for transmitting malaria?","options":{"a":"Aedes mosquito","b":"Anopheles mosquito","c":"Culex mosquito","d":"Sandfly"},"answer":"b"},{"n":3,"q":"Which of the following is a protozoan disease?","options":{"a":"Cholera","b":"Typhoid","c":"Amoebiasis","d":"Tuberculosis"},"answer":"c"},{"n":4,"q":"Vaccination provides immunity by:","options":{"a":"Stimulating the production of antibiotics","b":"Stimulating the production of antibodies","c":"Killing the pathogens directly","d":"None of the above"},"answer":"b"},{"n":5,"q":"The ":"b"},{"n":18,"q":"Which of the following diseases is NOT caused by a virus?","options":{"a":"Hepatitis","b":"Influenza","c":"Tuberculosis","d":"Measles"},"answer":"c"},{"n":19,"q":"Which of the following diseases can be prevented by vaccination?","options":{"a":"Diabetes","b":"Hypertension","c":"Polio","d":"Cancer"},"answer":"c"},{"n":20,"q":"Which of the following is a vector-borne disease?","options":{"a":"Tuberculosis","b":"Malaria","c":"Cholera","d":"Typhoid"},"answer":"b"},{"n":21,"q":"The causative agent of tuberculosis is:","options":{"a":"Virus","b":"Bacteria","c":"Fungus","d":"Protozoa er"},"answer":"b"},{"n":22,"q":"Which of the following diseases affects the human liver?","options":{"a":"Malaria","b":"Tuberculosis","c":"Hepatitis","d":"Influenza"},"answer":"c"},{"n":23,"q":"Which of the following diseases is caused by a virus?","options":{"a":"Cholera","b":"Tuberculosis","c":"AIDS","d":"Typhoid"},"answer":"c"},{"n":24,"q":"Which of the following is NOT a symptom of malaria?","options":{"a":"Fever","b":"Chills","c":"Cough","d":"Sweating"},"answer":"c"},{"n":25,"q":"Which of the following diseases is NOT preventable by vaccination?","options":{"a":"Measles","b":"Tuberculosis","c":"HIV/AIDS","d":"Polio"},"answer":"c"},{"n":26,"q":"Which of the following is an example of an autoimmune disease?","options":{"a":"Diabetes","b":"Hypertension","c":"Rheumatoid arthritis","d":"Cancer E"},"answer":"c"},{"n":27,"q":"Which of the following diseases is caused by a helminth?","options":{"a":"Malaria","b":"Tuberculosis","c":"Filariasis","d":"Cholera"},"answer":"c"},{"n":28,"q":"Which of the following diseases is NOT transmitted through contaminated food and water?","options":{"a":"Cholera","b":"Typhoid","c":"Hepatitis A","d":"Tuberculosis"},"answer":"d"},{"n":29,"q":"Which of the following is NOT a characteristic of cancer cells?","options":{"a":"Uncontrolled growth","b":"Invasiveness","c":"Apoptosis","d":"Metastasis"},"answer":"c"},{"n":30,"q":"Which of the following diseases is caused by a prion?","options":{"a":"AIDS","b":"Creutzfeldt-Jakob disease","c":"Tuberculosis","d":"Malaria"},"answer":"b"},{"n":31,"q":"Which of the following diseases is caused by a fungus?","options":{"a":"Ringworm","b":"Tuberculosis","c":"Malaria","d":"Cholera"},"answer":"a"},{"n":32,"q":"Which of the following is NOT a bacterial disease?","options":{"a":"Tuberculosis","b":"Cholera","c":"Typhoid","d":"Influenza"},"answer":"d"},{"n":33,"q":"Which of the following is NOT a sexually transmitted infection (STI)?","options":{"a":"Gonorrhea","b":"Syphilis","c":"Hepatitis B","d":"Influenza"},"answer":"d"},{"n":34,"q":"Which of the following diseases can be treated with antibiotics?","options":{"a":"Malaria","b":"Tuberculosis","c":"HIV/AIDS","d":"Influenza"},"answer":"b"},{"n":35,"q":"Which of the following is NOT a method of HIV transmission?","options":{"a":"Sexual contact","b":"Sharing needles","c":"Coughing and sneezing","d":"Mother to child during birth"},"answer":"c"},{"n":36,"q":"Which of the following diseases is associated with the deficiency of iodine?","options":{"a":"Diabetes","b":"Goiter","c":"Hypertension","d":"Anemia"},"answer":"b"},{"n":37,"q":"Which of the following is an example of passive immunity?","options":{"a":"Vaccination","b":"Breastfeeding","c":"Infection recovery","d":"Immunotherapy er"},"answer":"b"}]}];
const $=id=>document.getElementById(id);
let activeChapter=-1, batch=0, deck=[], current=[], checked=false, answers={};
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filteredChapters(){const term=$('chapterSearch').value.trim().toLocaleLowerCase();return DATA.map((c,i)=>({...c,_i:i})).filter(c=>c.title.toLocaleLowerCase().includes(term))}
function chapterButton(ch){const b=document.createElement('button');b.className='chapter'+(ch._i===activeChapter?' active':'');b.type='button';b.innerHTML='<span></span><span class="arrow" aria-hidden="true">›</span>';b.firstElementChild.textContent=ch.title;b.addEventListener('click',()=>selectChapter(ch._i));return b}
function renderChapterLists(){const list=filteredChapters();for(const id of ['chapterGrid','contentsList']){const el=$(id);el.replaceChildren();list.forEach(ch=>el.appendChild(chapterButton(ch)));if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No chapter matches that name.';el.appendChild(e)}}}
function selectChapter(i){activeChapter=i;batch=0;deck=shuffle(DATA[i].questions);renderChapterLists();$('startState').classList.add('hidden');$('practice').classList.remove('hidden');$('chapterTitle').textContent=DATA[i].title;loadBatch()}
function loadBatch(){checked=false;answers={};const start=batch*5;current=deck.slice(start,start+5);if(current.length===0){deck=shuffle(DATA[activeChapter].questions);batch=0;current=deck.slice(0,5);$('notice').textContent='A new practice round is ready.'}else $('notice').textContent='';$('score').textContent='';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=false;$('nextBtn').classList.add('hidden');$('retryBtn').classList.add('hidden');renderQuestions()}
function renderQuestions(){const root=$('questions');root.replaceChildren();if(!current.length){const e=document.createElement('div');e.className='empty';e.textContent='Questions for this chapter are not available yet.';root.appendChild(e);$('checkBtn').disabled=true;return}current.forEach((q,idx)=>{const card=document.createElement('article');card.className='qcard';const title=document.createElement('div');title.className='qtext';title.textContent=(idx+1)+'. '+q.q;card.appendChild(title);const opts=document.createElement('div');opts.className='options';['a','b','c','d'].forEach(key=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type='radio';input.name='q-'+idx;input.value=key;input.disabled=checked;input.checked=answers[idx]===key;input.addEventListener('change',()=>{answers[idx]=key;opts.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected')});const span=document.createElement('span');span.textContent=key.toUpperCase()+'. '+q.options[key];label.append(input,span);if(input.checked)label.classList.add('selected');opts.appendChild(label)});card.appendChild(opts);const feedback=document.createElement('div');feedback.className='feedback';feedback.id='feedback-'+idx;card.appendChild(feedback);root.appendChild(card)})}
function explanation(q){const t=(q.q+' '+Object.values(q.options||{}).join(' ')).toLowerCase();const correct=q.options?.[q.answer]||'';if(/not a polysaccharide|sucrose/.test(t)&&/polysaccharide/.test(t))return 'Sucrose is a disaccharide, while starch, cellulose and glycogen are polysaccharides.';if(/long chain of amino acids|polypeptide/.test(t))return 'A polypeptide is a chain of amino acids linked by peptide bonds.';if(/secondary structure of proteins|hydrogen bonds/.test(t))return 'Hydrogen bonds help stabilize protein alpha-helices and beta-sheets.';if(/primary structure of a protein|sequence of amino acids/.test(t))return 'A protein’s primary structure is its specific amino-acid sequence.';if(/monosaccharide/.test(t)&&/glucose/.test(t))return 'Glucose is a single sugar unit, so it is a monosaccharide.';if(/si unit of force/.test(t))return 'The SI unit of force is the newton (N).';if(/si unit of electric current/.test(t))return 'Electric current is measured in amperes (A).';if(/si unit of energy/.test(t))return 'Energy is measured in joules (J) in the SI system.';if(/avogadro/.test(t))return 'Avogadro’s constant is approximately 6.022 × 10²³ entities per mole.';if(/molar mass of h₂o|molar mass of h2o/.test(t))return 'Water (H₂O) has a molar mass of about 18 g/mol: 2(1) + 16.';if(/present simple/.test(t)&&/reads a book|go to the gym|visit our grandparents/.test(t))return 'The present simple commonly describes habits, routines and general facts.';if(/past simple/.test(t)&&/ate breakfast|bought a car|went shopping/.test(t))return 'The past simple describes a completed past action.';if(/future simple/.test(t)&&/will/.test(correct.toLowerCase()))return 'The future simple is commonly formed with “will” + the base verb.';return 'Review this idea in the selected chapter and compare it with the correct option.'}
function checkAnswers(){if(checked)return;checked=true;let correct=0;current.forEach((q,i)=>{const fb=$('feedback-'+i);const key=q.answer;const chosen=answers[i];const labels=$('questions').children[i].querySelectorAll('.option');labels.forEach((label,j)=>{const opt=['a','b','c','d'][j];const input=label.querySelector('input');input.disabled=true;if(opt===key)label.classList.add('correct');if(chosen===opt&&chosen!==key)label.classList.add('incorrect')});const isRight=chosen===key;if(isRight)correct++;fb.className='feedback show'+(isRight?'':' wrong');const answerText=key&&q.options?.[key]?key.toUpperCase()+'. '+q.options[key]:'Answer key unavailable';fb.textContent=(isRight?'Correct. ':'Correct answer: ')+answerText+' — '+explanation(q);});$('score').textContent='Correct answers: '+correct;$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('retryBtn').classList.remove('hidden');$('notice').textContent='Answers and explanations are now shown.'}
$('chapterSearch').addEventListener('input',renderChapterLists);$('checkBtn').addEventListener('click',checkAnswers);$('nextBtn').addEventListener('click',()=>{batch++;if(batch*5>=deck.length){deck=shuffle(DATA[activeChapter].questions);batch=0;$('notice').textContent='A new practice round is ready.'}loadBatch()});$('retryBtn').addEventListener('click',()=>{const prev=current.slice();current=prev;checked=false;answers={};$('score').textContent='';$('checkBtn').classList.remove('hidden');$('checkBtn').disabled=false;$('nextBtn').classList.add('hidden');$('retryBtn').classList.add('hidden');$('notice').textContent='';renderQuestions()});renderChapterLists();
</script></body></html>
